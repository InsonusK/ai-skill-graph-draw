[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diagram-renderer"
version = "1.0.1"
description = "CLI utility for building and updating diagram files from markdown links."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "InsonusK"},
]
keywords = ["obsidian", "canvas", "markdown", "diagram", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "PyYAML>=6.0",
    "python-igraph>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
]

[project.scripts]
diagram-renderer = "diagram_renderer.__main__:main"

[project.urls]
Homepage = "https://github.com/InsonusK/ai-skill-graph-draw"
Repository = "https://github.com/InsonusK/ai-skill-graph-draw"
Issues = "https://github.com/InsonusK/ai-skill-graph-draw/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["diagram_renderer*"]
exclude = ["tests*"]
